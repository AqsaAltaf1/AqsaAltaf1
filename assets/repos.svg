<svg xmlns="http://www.w3.org/2000/svg" width="900" height="552" viewBox="0 0 900 552" role="img" aria-label="Open-source and side projects"><defs><g id="heart"><path d="M0,-4 C-7,-13 -18,-2 0,10 C18,-2 7,-13 0,-4 Z"/></g><g id="spark"><path d="M0,-10 Q1.5,-1.5 10,0 Q1.5,1.5 0,10 Q-1.5,1.5 -10,0 Q-1.5,-1.5 0,-10 Z"/></g></defs><g font-family="'Trebuchet MS','Verdana','Segoe UI',sans-serif"><rect x="6" y="6" width="438" height="168" rx="26" fill="#E8DEFF"/><rect x="8" y="8" width="434" height="164" rx="24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/><use href="#heart" x="414" y="36" fill="#C9A8FF"/><text x="30" y="46" font-size="21" font-weight="800" fill="#5B43C2">Job Platform</text><text x="30" y="76" font-size="14" font-weight="600" fill="#4B3A96">A fairer, structured alternative to reference checks</text><text x="30" y="96" font-size="14" font-weight="600" fill="#4B3A96">with identity verification and privacy controls.</text><rect x="30" y="126" width="97" height="28" rx="14" fill="#FFFFFF" opacity="0.88"/><text x="78.5" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#4B3A96">TypeScript</text><rect x="135" y="126" width="75" height="28" rx="14" fill="#FFFFFF" opacity="0.88"/><text x="172.5" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#4B3A96">Next.js</text><rect x="218" y="126" width="60" height="28" rx="14" fill="#FFFFFF" opacity="0.88"/><text x="248" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#4B3A96">React</text><rect x="462" y="6" width="438" height="168" rx="26" fill="#FFE0EE"/><rect x="464" y="8" width="434" height="164" rx="24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/><use href="#spark" x="870" y="36" fill="#FF9EC7"/><text x="486" y="46" font-size="21" font-weight="800" fill="#C2417A">Verra</text><text x="486" y="76" font-size="14" font-weight="600" fill="#9A3A68">iOS app and API for trainers and clients: invites,</text><text x="486" y="96" font-size="14" font-weight="600" fill="#9A3A68">onboarding, scheduling and messaging.</text><rect x="486" y="126" width="60" height="28" rx="14" fill="#FFFFFF" opacity="0.88"/><text x="516" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#9A3A68">Swift</text><rect x="554" y="126" width="60" height="28" rx="14" fill="#FFFFFF" opacity="0.88"/><text x="584" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#9A3A68">Vapor</text><rect x="622" y="126" width="97" height="28" rx="14" fill="#FFFFFF" opacity="0.88"/><text x="670.5" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#9A3A68">PostgreSQL</text><rect x="6" y="192" width="438" height="168" rx="26" fill="#D8F5E8"/><rect x="8" y="194" width="434" height="164" rx="24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/><use href="#heart" x="414" y="222" fill="#8FE0BE"/><text x="30" y="232" font-size="21" font-weight="800" fill="#1F8A68">Face Detection Streaming</text><text x="30" y="262" font-size="14" font-weight="600" fill="#1B6F54">Video streaming over WebSockets with MediaPipe face</text><text x="30" y="282" font-size="14" font-weight="600" fill="#1B6F54">detection and stored results.</text><rect x="30" y="312" width="75" height="28" rx="14" fill="#FFFFFF" opacity="0.88"/><text x="67.5" y="331" text-anchor="middle" font-size="13" font-weight="700" fill="#1B6F54">FastAPI</text><rect x="113" y="312" width="60" height="28" rx="14" fill="#FFFFFF" opacity="0.88"/><text x="143" y="331" text-anchor="middle" font-size="13" font-weight="700" fill="#1B6F54">React</text><rect x="181" y="312" width="67" height="28" rx="14" fill="#FFFFFF" opacity="0.88"/><text x="214.5" y="331" text-anchor="middle" font-size="13" font-weight="700" fill="#1B6F54">Docker</text><rect x="462" y="192" width="438" height="168" rx="26" fill="#D6ECFF"/><rect x="464" y="194" width="434" height="164" rx="